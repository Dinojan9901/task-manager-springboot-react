spring.application.name=task-manager
server.port=8081

# PostgreSQL. Defaults match compose.yaml; override with environment variables in other environments
# (e.g. the backend container sets DB_URL=jdbc:postgresql://db:5432/tasks).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tasks}
spring.datasource.username=${DB_USERNAME:tasks}
spring.datasource.password=${DB_PASSWORD:tasks}

# JPA / Hibernate
# "update" creates/alters tables from the entities. Fine for a demo; a production app would use
# Flyway or Liquibase migrations and "validate" here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Don't keep the DB session open while the HTTP response is being written
spring.jpa.open-in-view=false

# Origins allowed to call the API from a browser (comma-separated). See config/CorsProperties.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Insert sample tasks into an empty database on startup
app.seed-data=${SEED_DATA:true}
