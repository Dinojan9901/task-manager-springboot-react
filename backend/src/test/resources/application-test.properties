# Activated with @ActiveProfiles("test"): swaps PostgreSQL for an in-memory H2 database,
# so tests need no running database. MODE=PostgreSQL makes H2 mimic Postgres SQL behaviour.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Tests create exactly the data they need
app.seed-data=false
