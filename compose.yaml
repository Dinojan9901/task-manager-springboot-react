# Full stack:      docker compose up --build      -> http://localhost:3000
# Database only:   docker compose up -d db        (then run backend/frontend locally)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Inside the Compose network the database is reachable by its service name
      DB_URL: jdbc:postgresql://db:5432/tasks
      DB_USERNAME: tasks
      DB_PASSWORD: tasks
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # Override with FRONTEND_PORT if 3000 is taken, e.g. FRONTEND_PORT=3001 docker compose up
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
