server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container. Same idea as the Vite dev proxy:
    # the browser only talks to one origin, so no CORS is needed in this setup.
    location /api/ {
        proxy_pass http://backend:8081;
        # $http_host keeps the port (e.g. localhost:3000) so the API builds correct Location URLs
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
